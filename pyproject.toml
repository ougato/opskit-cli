[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opskit"
version = "1.0.0"
description = "OpsKit — 极简运维面板"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ougato" }]
keywords = ["devops", "sysadmin", "tui", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "rich>=13.7",
    "typer>=0.12",
    "click>=8.1",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "sentry-sdk>=2.0,<3",
    "cryptography>=44.0",
]

[project.scripts]
opskit = "main:app"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-timeout>=2.3",
    "build>=1.2",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "core*",
    "monitor*",
    "software*",
    "network*",
    "xui*",
    "tailscale*",
    "wireguard*",
    "plugin",
]

[tool.setuptools.package-data]
"core" = ["themes/*.yaml", "locale/*.yaml", "mirrors/*.yaml"]
