name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  notify-start:
    name: notify build start
    runs-on: ubuntu-latest
    steps:
      - name: send build-notify
        continue-on-error: true
        env:
          HOOK_URL: ${{ secrets.HOOK_URL }}
          HOOK_SECRET: ${{ secrets.HOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK_URL:-}" ]; then echo "::error::HOOK_URL secret is empty or not set"; exit 1; fi
          if [ -z "${HOOK_SECRET:-}" ]; then echo "::error::HOOK_SECRET secret is empty or not set (server will return 401)"; exit 1; fi
          HOOK_URL="${HOOK_URL%/}"
          # hook 服务要求 X-Hook-Secret = hex(HMAC-SHA256(HOOK_SECRET, 原始 body))，不能传密钥原文
          BODY='{"event":"build_start"}'
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$HOOK_SECRET" -binary | xxd -p | tr -d '\n')
          curl -fsSL -X POST "${HOOK_URL}/build-notify" \
            -H "X-Hook-Secret: ${SIG}" \
            -H "Content-Type: application/json" \
            --data-binary "$BODY"
          echo "[hook] build-notify sent"

  test:
    needs: [notify-start]
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: install locked installer
        run: >-
          python -I -m pip --isolated --disable-pip-version-check install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --no-deps -r requirements-installer.txt
      - name: install deps
        run: |
          python -I -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --no-deps -r requirements-ci.txt

      - name: sync version from tag
        run: python scripts/release_bump.py "${GITHUB_REF_NAME}"

      - name: run tests
        run: python -m pytest tests/ -v --tb=short --timeout=30

  build:
    needs: test
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: opskit-linux-x64
            manylinux: true
          - os: ubuntu-22.04-arm
            artifact: opskit-linux-arm64
            manylinux: false
          - os: windows-latest
            artifact: opskit-windows-x64
            manylinux: false
          - os: macos-latest
            artifact: opskit-darwin-arm64
            manylinux: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # tag → APP_VERSION / bootstrap，确保编译进二进制的自报版本与 tag 一致（防版本漂移导致更新自锁）
      - name: sync version from tag
        shell: python
        run: |
            import os, subprocess, sys
            sys.exit(subprocess.call([sys.executable, "scripts/release_bump.py", os.environ["GITHUB_REF_NAME"]]))

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ !matrix.manylinux }}
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: pin release verification key
        env:
          OPSKIT_RELEASE_PUBLIC_KEY: ${{ vars.OPSKIT_RELEASE_PUBLIC_KEY }}
        run: python scripts/pin_release_key.py

      - name: install deps (non-manylinux)
        if: ${{ !matrix.manylinux }}
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "opskit-build"
          subprocess.check_call([sys.executable, "-I", "scripts/install_release_build.py", str(root)])
          python = root / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"OPSKIT_BUILD_PYTHON={python}\n")

      - name: provision reviewed Windows build tool
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os, pathlib, subprocess
          cache = pathlib.Path(os.environ["RUNNER_TEMP"]) / "opskit-nuitka-cache"
          subprocess.check_call([os.environ["OPSKIT_BUILD_PYTHON"], "-I",
                                 "scripts/install_windows_build_tools.py", str(cache)])
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"NUITKA_CACHE_DIR={cache}\n")
              stream.write(f"NUITKA_CACHE_DIR_DOWNLOADS={cache / 'downloads'}\n")

      - name: build (manylinux container — glibc 2.17 compatible)
        if: ${{ matrix.manylinux }}
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            quay.io/pypa/manylinux2014_x86_64@sha256:f6a6f153c9cf45470507ebbc27013e5db14ce21331b62fd2c540561f25e5f0a5 \
            bash -c "
              set -e
              cd /opt/_internal && tar xf static-libs-for-embedding-only.tar.xz && cd /work
              ln -s /opt/rh/devtoolset-10/root/usr/bin/gcc /usr/local/bin/gcc
              ln -s /opt/rh/devtoolset-10/root/usr/bin/g++ /usr/local/bin/g++
              /opt/python/cp312-cp312/bin/python -I scripts/install_release_build.py /tmp/opskit-build
              /tmp/opskit-build/bin/python build.py build --backend nuitka --jobs 2
              chown -R \$(stat -c '%u:%g' /work) /work/dist/
            "

      - name: build (non-manylinux)
        if: ${{ !matrix.manylinux }}
        shell: python
        run: |
          import os, subprocess, sys
          sys.exit(subprocess.call([os.environ["OPSKIT_BUILD_PYTHON"], "build.py", "build", "--backend", "nuitka", "--jobs", "2"]))

      - name: verify frozen CLI outside source
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          name = "${{ matrix.artifact }}" + (".exe" if os.name == "nt" else "")
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "opskit-frozen-acceptance"
          subprocess.check_call([sys.executable, "-I", "scripts/verify_frozen_cli.py",
                                 str(pathlib.Path("dist") / name), "--build", os.environ["GITHUB_REF_NAME"][1:],
                                 "--output", str(output)])

      - name: upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    needs: [build]
    runs-on: ubuntu-latest
    # Serialize all tags, not only reruns of one tag. Queue order is not trusted;
    # the bootstrap preflight below also rejects an older version.
    concurrency:
      group: opskit-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Sign with the same immutable source used by this tag event's builds.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: artifacts/

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: validate complete artifact matrix
        run: python -I scripts/release_assets.py --build "${GITHUB_REF_NAME#v}" --root artifacts

      - name: install release verification dependency
        run: |
          set -euo pipefail
          python -I -m venv "$RUNNER_TEMP/opskit-signing"
          "$RUNNER_TEMP/opskit-signing/bin/python" -I -m pip --isolated --disable-pip-version-check install \
            --index-url https://pypi.org/simple --only-binary=:all: --require-hashes --no-deps \
            -r requirements-installer.txt
          "$RUNNER_TEMP/opskit-signing/bin/python" -I -m pip --isolated install \
            --index-url https://pypi.org/simple --only-binary=:all: --require-hashes --no-deps \
            -r requirements-release-signing.txt
          "$RUNNER_TEMP/opskit-signing/bin/python" -I -m pip check

      - name: sign release assets
        env:
          OPSKIT_RELEASE_SIGNING_KEY: ${{ secrets.OPSKIT_RELEASE_SIGNING_KEY }}
          OPSKIT_RELEASE_PUBLIC_KEY: ${{ vars.OPSKIT_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          BUILD="${GITHUB_REF_NAME#v}"
          for f in artifacts/*/opskit-*; do
            [[ "$f" == *.sha256 || "$f" == *.sig.json || "$f" == *.sig || "$f" == *.signed ]] && continue
            "$RUNNER_TEMP/opskit-signing/bin/python" -I scripts/sign_release.py --build "$BUILD" "$f"
          done

      - name: verify and publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPSKIT_RELEASE_PUBLIC_KEY: ${{ vars.OPSKIT_RELEASE_PUBLIC_KEY }}
        run: '"$RUNNER_TEMP/opskit-signing/bin/python" -I scripts/release_assets.py --build "${GITHUB_REF_NAME#v}" --root artifacts --publish'

      # 发布控制面：把 tag 对应的 build 写回默认分支的 constants.py + bootstrap.json，
      # 客户端经 raw.githubusercontent/<default>/bootstrap.json 即可发现新版本
      # Keep event source separate: branch contents are data, never release scripts.
      - name: checkout bootstrap publishing branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: bootstrap-target

      - name: publish bootstrap manifest
        env:
          OPSKIT_RELEASE_PUBLIC_KEY: ${{ vars.OPSKIT_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          python -I scripts/release_bump.py "${GITHUB_REF_NAME}" --root bootstrap-target --preflight
          python -I scripts/pin_release_key.py --root bootstrap-target
          python -I scripts/release_bump.py "${GITHUB_REF_NAME}" --root bootstrap-target
          python -I scripts/release_bump.py "${GITHUB_REF_NAME}" --root bootstrap-target --check
          if git -C bootstrap-target diff --quiet -- core/constants.py bootstrap.json install.sh install.ps1; then
            echo "[bootstrap] 无变更，跳过提交"
            exit 0
          fi
          git -C bootstrap-target config user.name  "github-actions[bot]"
          git -C bootstrap-target config user.email "github-actions[bot]@users.noreply.github.com"
          git -C bootstrap-target add core/constants.py bootstrap.json install.sh install.ps1
          git -C bootstrap-target commit -m "chore(release): bump to ${GITHUB_REF_NAME} [skip ci]"
          git -C bootstrap-target push origin HEAD:"${{ github.event.repository.default_branch }}"
