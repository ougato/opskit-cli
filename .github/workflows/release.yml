name: Build and Release

on:
  push:
    branches:
      - release
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  notify-start:
    name: notify build start
    runs-on: ubuntu-latest
    steps:
      - name: send build-notify
        if: github.ref_type == 'tag'
        continue-on-error: true
        env:
          HOOK_URL: ${{ secrets.HOOK_URL }}
          HOOK_SECRET: ${{ secrets.HOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK_URL:-}" ]; then echo "::error::HOOK_URL secret is empty or not set"; exit 1; fi
          if [ -z "${HOOK_SECRET:-}" ]; then echo "::error::HOOK_SECRET secret is empty or not set (server will return 401)"; exit 1; fi
          HOOK_URL="${HOOK_URL%/}"
          # hook 服务要求 X-Hook-Secret = hex(HMAC-SHA256(HOOK_SECRET, 原始 body))，不能传密钥原文
          BODY='{"event":"build_start"}'
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$HOOK_SECRET" -binary | xxd -p | tr -d '\n')
          curl -fsSL -X POST "${HOOK_URL}/build-notify" \
            -H "X-Hook-Secret: ${SIG}" \
            -H "Content-Type: application/json" \
            --data-binary "$BODY"
          echo "[hook] build-notify sent"

  test:
    if: github.ref_type == 'branch'
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.version.outputs.build }}
      previous: ${{ steps.previous.outputs.build }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: create isolated test environment
        shell: python
        run: |
          import os, pathlib, venv
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'opskit-release-tests'
          venv.EnvBuilder(with_pip=True).create(root)
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as stream:
              stream.write(str(root / ('Scripts' if os.name == 'nt' else 'bin')) + '\n')

      - name: install locked installer
        run: >-
          python -I -m pip --isolated --disable-pip-version-check install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --no-deps -r requirements-installer.txt
      - name: install deps
        run: |
          python -I -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --no-deps -r requirements-ci.txt

      - name: verify committed release version
        id: version
        run: |
          set -euo pipefail
          build="$(python -c 'from scripts.release_bump import read_app_version; print(read_app_version())')"
          python scripts/release_bump.py "v$build" --check
          printf 'build=%s\n' "$build" >> "$GITHUB_OUTPUT"

      - name: identify previous published build
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          previous="$(python -I scripts/release_assets.py --build "$BUILD_VERSION" --previous-build)"
          printf 'build=%s\n' "$previous" >> "$GITHUB_OUTPUT"

      - name: run tests
        shell: bash
        run: |
          mkdir -p cache
          set -o pipefail
          python -m pytest tests/ -v --tb=short --timeout=30 --junitxml=cache/release-tests.xml 2>&1 | tee cache/release-tests.log

      - name: save release test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tests
          path: |
            cache/release-tests.xml
            cache/release-tests.log
          if-no-files-found: ignore

  build:
    needs: test
    env:
      BUILD_VERSION: ${{ needs.test.outputs.build }}
      DIRECTORY_BASE_BUILD: ${{ needs.test.outputs.previous }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: opskit-linux-x64
            manylinux: true
          - os: ubuntu-22.04-arm
            artifact: opskit-linux-arm64
            manylinux: false
          - os: windows-latest
            artifact: opskit-windows-x64
            manylinux: false
          - os: macos-latest
            artifact: opskit-darwin-arm64
            manylinux: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: fetch verified incremental base
        if: runner.os != 'macOS' && needs.test.outputs.previous != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OPSKIT_ARTIFACT: ${{ matrix.artifact }}
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.check_call([sys.executable, "-I", "scripts/release_assets.py", "--build",
                                 os.environ["DIRECTORY_BASE_BUILD"], "--fetch-base", os.environ["OPSKIT_ARTIFACT"],
                                 "--root", "cache/release-base.tar.xz"])

      - name: install deps (non-manylinux)
        if: ${{ !matrix.manylinux }}
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "opskit-build"
          command = [sys.executable, "-I", "scripts/install_release_build.py", str(root)]
          if sys.platform != "darwin":
              command += ["--directory"]
          subprocess.check_call(command)
          python = root / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"OPSKIT_BUILD_PYTHON={python}\n")

      - name: provision reviewed Windows build tool
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os, pathlib, subprocess
          cache = pathlib.Path(os.environ["RUNNER_TEMP"]) / "opskit-nuitka-cache"
          subprocess.check_call([os.environ["OPSKIT_BUILD_PYTHON"], "-I",
                                 "scripts/install_windows_build_tools.py", str(cache)])
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"NUITKA_CACHE_DIR={cache}\n")
              stream.write(f"NUITKA_CACHE_DIR_DOWNLOADS={cache / 'downloads'}\n")

      - name: provision shared CPython for manylinux directory builds
        if: ${{ matrix.manylinux }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opskit-shared-python.tar.gz"
          root="$RUNNER_TEMP/opskit-shared-python"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' \
            --output "$archive" \
            'https://github.com/astral-sh/python-build-standalone/releases/download/20261110/cpython-3.12.16%2B20261110-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz'
          printf '%s  %s\n' '6a9e62dad033790aef722dbd370e0ce76ce17b73627ba3ae679f537049350b39' "$archive" | sha256sum --check -
          mkdir "$root"
          tar -xzf "$archive" -C "$root" --strip-components=1

      - name: build (manylinux container — glibc 2.17 compatible)
        if: ${{ matrix.manylinux }}
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}:/work" \
            -v "$RUNNER_TEMP/opskit-shared-python:/opt/opskit-shared-python:ro" \
            -w /work \
            -e DIRECTORY_BASE_BUILD \
            quay.io/pypa/manylinux2014_x86_64@sha256:f6a6f153c9cf45470507ebbc27013e5db14ce21331b62fd2c540561f25e5f0a5 \
            bash -c "
              set -e
              cd /opt/_internal && tar xf static-libs-for-embedding-only.tar.xz && cd /work
              ln -s /opt/rh/devtoolset-10/root/usr/bin/gcc /usr/local/bin/gcc
              ln -s /opt/rh/devtoolset-10/root/usr/bin/g++ /usr/local/bin/g++
              /opt/python/cp312-cp312/bin/python -I scripts/install_release_build.py /tmp/opskit-build
              /tmp/opskit-build/bin/python build.py build --backend nuitka --jobs 2
              /opt/opskit-shared-python/bin/python3.12 -I scripts/install_release_build.py /tmp/opskit-dir-build --directory
              if [ -f cache/release-base.tar.xz ]; then
                /tmp/opskit-dir-build/bin/python build.py directory --base cache/release-base.tar.xz --base-build \"\$DIRECTORY_BASE_BUILD\"
              else
                /tmp/opskit-dir-build/bin/python build.py directory
              fi
              chown -R \$(stat -c '%u:%g' /work) /work/dist/
              chown \$(stat -c '%u:%g' /work) /work/_build/opskit-linux-x64.debug.tar.xz
            "

      - name: build (non-manylinux)
        if: ${{ !matrix.manylinux }}
        shell: python
        run: |
          import os, subprocess, sys
          sys.exit(subprocess.call([os.environ["OPSKIT_BUILD_PYTHON"], "build.py", "build", "--backend", "nuitka", "--jobs", "2"]))

      - name: build directory distribution (non-manylinux)
        if: ${{ !matrix.manylinux && runner.os != 'macOS' }}
        shell: python
        run: |
          import os, pathlib, subprocess
          command = [os.environ["OPSKIT_BUILD_PYTHON"], "build.py", "directory"]
          base = pathlib.Path("cache/release-base.tar.xz")
          if base.is_file():
              command += ["--base", str(base), "--base-build", os.environ["DIRECTORY_BASE_BUILD"]]
          subprocess.check_call(command)

      - name: verify frozen CLI outside source
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          name = "${{ matrix.artifact }}" + (".exe" if os.name == "nt" else "")
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "opskit-frozen-acceptance"
          subprocess.check_call([sys.executable, "-I", "scripts/verify_frozen_cli.py",
                                 str(pathlib.Path("dist") / name), "--build", os.environ["BUILD_VERSION"],
                                 "--output", str(output)])

      - name: install and verify directory distribution outside source
        if: runner.os != 'macOS'
        shell: python
        env:
          OPSKIT_ARTIFACT: ${{ matrix.artifact }}
        run: |
          import os, pathlib, subprocess, sys
          name = os.environ["OPSKIT_ARTIFACT"]
          extension = ".exe" if os.name == "nt" else ""
          dist = pathlib.Path("dist").resolve()
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "opskit-installed-directory"
          root.mkdir()
          target = root / ("opskit" + extension)
          build = os.environ["BUILD_VERSION"]
          subprocess.check_call([str(dist / (name + "-launcher" + extension)), "--opskit-internal-install",
                                 str(dist / (name + ".tar.xz")), str(target), "v" + build], cwd=root)
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "opskit-directory-acceptance"
          subprocess.check_call([sys.executable, "-I", "scripts/verify_frozen_cli.py", str(target),
                                 "--build", build, "--output", str(output)])

      - name: upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

      - name: retain Linux debug symbols
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: debug-symbols-${{ matrix.artifact }}
          path: _build/${{ matrix.artifact }}.debug.tar.xz
          compression-level: 0
          if-no-files-found: error

      - name: save frozen CLI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frozen-check-${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/opskit-frozen-acceptance/*.stdout
            ${{ runner.temp }}/opskit-frozen-acceptance/*.stderr
            ${{ runner.temp }}/opskit-frozen-acceptance/*.status.json
            ${{ runner.temp }}/opskit-frozen-acceptance/verification.json
          if-no-files-found: ignore

      - name: save directory CLI diagnostics
        if: always() && runner.os != 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: directory-check-${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/opskit-directory-acceptance/*.stdout
            ${{ runner.temp }}/opskit-directory-acceptance/*.stderr
            ${{ runner.temp }}/opskit-directory-acceptance/*.status.json
            ${{ runner.temp }}/opskit-directory-acceptance/verification.json
          if-no-files-found: ignore

  release-check:
    if: github.ref_type == 'branch'
    needs: [test, build]
    env:
      BUILD_VERSION: ${{ needs.test.outputs.build }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: opskit-*
          path: artifacts/

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: validate complete artifact matrix
        run: python -I scripts/release_assets.py --build "$BUILD_VERSION" --root artifacts

      - name: checkout current bootstrap data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: bootstrap-target
          persist-credentials: false

      - name: verify bootstrap update without publishing
        run: |
          set -euo pipefail
          version="v$BUILD_VERSION"
          python -I scripts/release_bump.py "$version" --root bootstrap-target --sync-installers --preflight
          python -I scripts/release_bump.py "$version" --root bootstrap-target --sync-installers
          python -I scripts/release_bump.py "$version" --root bootstrap-target --sync-installers --check

  release:
    if: github.ref_type == 'tag'
    needs: [notify-start]
    runs-on: ubuntu-latest
    # Serialize all tags, not only reruns of one tag. Queue order is not trusted;
    # the bootstrap preflight below also rejects an older version.
    concurrency:
      group: opskit-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Publish with the same immutable source used by this tag event's builds.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: select checked release artifacts
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -I scripts/release_bump.py "$GITHUB_REF_NAME" --check
          release_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release" --jq '.object.sha')"
          if [[ "$release_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::The tag must point to the current release branch commit"
            exit 1
          fi
          successful_run() {
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$1/runs" \
              -f branch="$2" -f event=push -f status=success -f head_sha="$GITHUB_SHA" \
              --jq '.workflow_runs[0].id // empty'
          }
          regression="$(successful_run test.yml develop)"
          candidate="$(successful_run release.yml release)"
          if [[ ! "$regression" =~ ^[0-9]+$ || ! "$candidate" =~ ^[0-9]+$ ]]; then
            echo "::error::The commit requires successful develop regression and release preflight"
            exit 1
          fi
          printf 'run_id=%s\n' "$candidate" >> "$GITHUB_OUTPUT"

      - name: download checked release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: opskit-*
          path: artifacts/
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate.outputs.run_id }}

      - name: validate complete artifact matrix
        run: python -I scripts/release_assets.py --build "${GITHUB_REF_NAME#v}" --root artifacts

      - name: verify and publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: 'python -I scripts/release_assets.py --build "${GITHUB_REF_NAME#v}" --root artifacts --publish'

      # 发布控制面：把 tag 对应的 build 写回默认分支的 constants.py + bootstrap.json，
      # 客户端经 raw.githubusercontent/<default>/bootstrap.json 即可发现新版本
      # Keep event source separate: branch contents are data, never release scripts.
      - name: checkout bootstrap publishing branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: bootstrap-target

      - name: publish bootstrap manifest
        run: |
          set -euo pipefail
          python -I scripts/release_bump.py "${GITHUB_REF_NAME}" --root bootstrap-target --sync-installers --preflight
          python -I scripts/release_bump.py "${GITHUB_REF_NAME}" --root bootstrap-target --sync-installers
          python -I scripts/release_bump.py "${GITHUB_REF_NAME}" --root bootstrap-target --sync-installers --check
          if git -C bootstrap-target diff --quiet -- core/constants.py bootstrap.json install.sh install.ps1; then
            echo "[bootstrap] 无变更，跳过提交"
            exit 0
          fi
          git -C bootstrap-target config user.name  "github-actions[bot]"
          git -C bootstrap-target config user.email "github-actions[bot]@users.noreply.github.com"
          git -C bootstrap-target add core/constants.py bootstrap.json install.sh install.ps1
          git -C bootstrap-target commit -m "chore(release): bump to ${GITHUB_REF_NAME} [skip ci]"
          git -C bootstrap-target push origin HEAD:"${{ github.event.repository.default_branch }}"
