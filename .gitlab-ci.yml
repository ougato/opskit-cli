stages:
  - test
  - release

# GitLab is the origin forge; branch/MR checks must not depend on a mirror.
# Windows/macOS remain covered by the GitHub matrix only when mirror syncing
# and those runs are verified. This Linux job is not a six-platform acceptance.
regression_linux:
  stage: test
  image: "python:${PYTHON_VERSION}-slim"
  timeout: 20m
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.12"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_NO_INPUT: "1"
  before_script:
    - apt-get update
    - apt-get install --no-install-recommends -y git
    - python -m pip install --isolated --only-binary=:all: --index-url https://pypi.org/simple -e ".[dev]"
  script:
    - python -m pip check
    - python -m ruff check .
    - python scripts/check_static_debt.py
    - python -I -m build --wheel --outdir cache/wheels
    - python scripts/verify_wheel.py cache/wheels
    - python -m venv cache/wheel-environment
    - cache/wheel-environment/bin/python -m pip install --isolated --only-binary=:all: --index-url https://pypi.org/simple cache/wheels/*.whl
    - cache/wheel-environment/bin/python -m pip check
    - python scripts/verify_installed_cli.py cache/wheel-environment cache/installed-cli
    - python -m pytest -q --timeout=20 --basetemp=cache/ci-tests --junitxml=cache/ci-results.xml
  artifacts:
    when: always
    paths:
      - cache/ci-results.xml
      - cache/installed-cli/verification.json
    reports:
      junit: cache/ci-results.xml
    expire_in: 7 days

# ─── release: 创建 GitLab Release，所有平台链接指向 GitHub Releases ─────────
release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  script:
    - echo "Creating GitLab Release ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "OpsKit ${CI_COMMIT_TAG}"
    description: |
      ## OpsKit ${CI_COMMIT_TAG}

      全平台产物由 GitHub Actions 构建，下载链接指向 GitHub Releases。

      | 平台 | 架构 | 文件 |
      |---|---|---|
      | Linux | x64 | opskit-linux-x64 |
      | Linux | arm64 | opskit-linux-arm64 |
      | Windows | x64 | opskit-windows-x64.exe |
      | macOS | arm64 (M 系列) | opskit-darwin-arm64 |
    assets:
      links:
        - name: "opskit-linux-x64"
          url: "https://github.com/ougato/opskit-cli/releases/download/${CI_COMMIT_TAG}/opskit-linux-x64"
          link_type: other
        - name: "opskit-linux-arm64"
          url: "https://github.com/ougato/opskit-cli/releases/download/${CI_COMMIT_TAG}/opskit-linux-arm64"
          link_type: other
        - name: "opskit-windows-x64.exe"
          url: "https://github.com/ougato/opskit-cli/releases/download/${CI_COMMIT_TAG}/opskit-windows-x64.exe"
          link_type: other
        - name: "opskit-darwin-arm64"
          url: "https://github.com/ougato/opskit-cli/releases/download/${CI_COMMIT_TAG}/opskit-darwin-arm64"
          link_type: other

